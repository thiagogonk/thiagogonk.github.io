<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="theme-switcher">
        <span>Escolha o ambiente:</span>
        <button onclick="setTheme('forest')">Floresta (Verde)</button>
        <button onclick="setTheme('minimal')">Claro (Branco)</button>
    </div>
    <nav class="navbar">
        <div class="logo">MeuPortfólio</div>
        <ul class="nav-links">
            <li><a href="#about">Sobre</a></li>
            <li><a href="#projects">Projetos</a></li>
            <li><a href="#contact">Contato</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Olá, eu sou [Seu Nome]</h1>
        <p>Desenvolvedor focado em soluções limpas e eficientes.</p>
        <a href="#projects" class="btn">Ver Projetos</a>
    </header>

    <section id="projects" class="section">
        <h2>Projetos em Destaque</h2>
        <div class="grid">
            <div class="card">Projeto 1</div>
            <div class="card">Projeto 2</div>
            <div class="card">Projeto 3</div>
        </div>
    </section>

    <section id="notes" class="section">
        <h2>Diário de Estudos</h2>

        <div id="tag-filters" class="filters">
            <button class="tag-btn active" onclick="filterNotes('all')">#todos</button>
        </div>

        <div id="notes-container" class="notes-grid">
        </div>
    </section>

    <footer id="contact">
        <p>© 2026 - Criado por [Seu Nome]</p>
    </footer>
    <script>
        function setTheme(theme) {
            const root = document.documentElement;
            if (theme === 'forest') {
                root.style.setProperty('--bg-color', '#ffffff');
                root.style.setProperty('--primary-color', '#0a2e24');
                root.style.setProperty('--text-color', '#0a2e24');
                root.style.setProperty('--hero-bg', '#0a2e24');
                root.style.setProperty('--hero-text', '#ffffff');
            } else {
                root.style.setProperty('--bg-color', '#f9f9f9');
                root.style.setProperty('--primary-color', '#444444');
                root.style.setProperty('--text-color', '#222222');
                root.style.setProperty('--hero-bg', '#ffffff');
                root.style.setProperty('--hero-text', '#222222');
            }
        }

        const myNotes = [
            {
                date: "2026-04-29",
                content: "Estudando animações avançadas com CSS Transitions e Variables.",
                tags: ["#css", "#webdesign"]
            },
            {
                date: "2026-04-28",
                content: "Configurando o ambiente do GitHub Pages para automação.",
                tags: ["#github", "#devops"]
            },
            {
                date: "2026-04-25",
                content: "Aprendendo como estruturar layouts minimalistas.",
                tags: ["#design", "#minimalismo"]
            }
        ];

        function renderNotes(filter = 'all') {
            const container = document.getElementById('notes-container');
            container.innerHTML = ''; // Limpa antes de renderizar

            const filtered = filter === 'all'
                ? myNotes
                : myNotes.filter(n => n.tags.includes(filter));

            filtered.forEach(note => {
                const noteElement = document.createElement('div');
                noteElement.className = 'note-card';
                noteElement.innerHTML = `
            <small>${note.date}</small>
            <p>${note.content}</p>
            <div class="note-tags">
                ${note.tags.map(t => `<span class="tag" onclick="filterNotes('${t}')">${t}</span>`).join('')}
            </div>
        `;
                container.appendChild(noteElement);
            });
        }

        function filterNotes(tag) {
            renderNotes(tag);
            // Lógica opcional para destacar o botão ativo
        }

        // Inicializa as notas ao carregar a página
        renderNotes();
    </script>
</body>

</html>
